<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <style>
    @keyframes stretch {
      0%,100% { transform: scaleX(1) scaleY(1); }
      50%      { transform: scaleX(1.1) scaleY(0.95); }
    }
    .g { transform-origin: 50px 60px; animation: stretch 2.5s ease-in-out infinite; }
  </style>
  <g class="g">
    <!-- mat -->
    <rect x="10" y="70" width="80" height="8" rx="4" fill="#c7d2fe"/>
    <!-- body lying -->
    <ellipse cx="50" cy="62" rx="28" ry="7" fill="#6366f1"/>
    <!-- legs up -->
    <line x1="60" y1="62" x2="72" y2="38" stroke="#4f46e5" stroke-width="6" stroke-linecap="round"/>
    <line x1="68" y1="62" x2="80" y2="38" stroke="#4f46e5" stroke-width="6" stroke-linecap="round"/>
    <!-- head -->
    <circle cx="24" cy="57" r="9" fill="#818cf8"/>
    <!-- arm up -->
    <line x1="30" y1="58" x2="18" y2="40" stroke="#818cf8" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
