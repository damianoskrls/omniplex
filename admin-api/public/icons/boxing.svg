<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <style>
    @keyframes punch {
      0%,100% { transform: translateX(0) rotate(0); }
      40%      { transform: translateX(12px) rotate(-10deg); }
      60%      { transform: translateX(-12px) rotate(10deg); }
    }
    .glove { animation: punch 0.8s ease-in-out infinite; transform-origin: 50px 50px; }
  </style>
  <g class="glove">
    <!-- left glove -->
    <rect x="8" y="38" width="30" height="26" rx="12" fill="#ef4444"/>
    <rect x="8" y="38" width="14" height="10" rx="5" fill="#dc2626"/>
    <!-- right glove -->
    <rect x="62" y="38" width="30" height="26" rx="12" fill="#ef4444"/>
    <rect x="78" y="38" width="14" height="10" rx="5" fill="#dc2626"/>
    <!-- center impact star -->
    <polygon points="50,42 53,48 60,48 55,53 57,60 50,56 43,60 45,53 40,48 47,48" fill="#fbbf24" opacity="0.9"/>
  </g>
</svg>
