<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <style>
    .bar { fill: #6366f1; }
    .weight { fill: #4f46e5; rx: 6; }
    .group { transform-origin: 50px 50px; animation: pump 1.2s ease-in-out infinite; }
    @keyframes pump {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
  </style>
  <g class="group">
    <!-- bar -->
    <rect class="bar" x="20" y="47" width="60" height="6" rx="3"/>
    <!-- left weights -->
    <rect class="weight" x="10" y="36" width="14" height="28" rx="4"/>
    <rect class="weight" x="4" y="40" width="8" height="20" rx="3"/>
    <!-- right weights -->
    <rect class="weight" x="76" y="36" width="14" height="28" rx="4"/>
    <rect class="weight" x="88" y="40" width="8" height="20" rx="3"/>
  </g>
</svg>
