<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <style>
    @keyframes jump {
      0%,100% { transform: translateY(0); }
      40%      { transform: translateY(-14px); }
      60%      { transform: translateY(-10px); }
    }
    .g { transform-origin: 50px 60px; animation: jump 0.7s ease-in-out infinite; }
  </style>
  <g class="g">
    <!-- head -->
    <circle cx="50" cy="18" r="9" fill="#f97316"/>
    <!-- body -->
    <rect x="43" y="28" width="14" height="18" rx="5" fill="#ea580c"/>
    <!-- arms raised -->
    <line x1="43" y1="32" x2="22" y2="20" stroke="#fb923c" stroke-width="5" stroke-linecap="round"/>
    <line x1="57" y1="32" x2="78" y2="20" stroke="#fb923c" stroke-width="5" stroke-linecap="round"/>
    <!-- legs -->
    <line x1="46" y1="46" x2="32" y2="70" stroke="#c2410c" stroke-width="6" stroke-linecap="round"/>
    <line x1="54" y1="46" x2="68" y2="70" stroke="#c2410c" stroke-width="6" stroke-linecap="round"/>
  </g>
  <!-- ground shadow -->
  <ellipse cx="50" cy="82" rx="22" ry="4" fill="#fed7aa" opacity="0.5">
    <animate attributeName="rx" values="22;14;22" dur="0.7s" repeatCount="indefinite"/>
  </ellipse>
</svg>
