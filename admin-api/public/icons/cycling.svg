<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <style>
    @keyframes spin { from { transform: rotate(0); } to { transform: rotate(360deg); } }
    .wheel { transform-origin: center; animation: spin 1s linear infinite; }
    .wl { transform-origin: 25px 65px; }
    .wr { transform-origin: 75px 65px; }
  </style>
  <!-- left wheel -->
  <g class="wheel wl">
    <circle cx="25" cy="65" r="18" fill="none" stroke="#6366f1" stroke-width="4"/>
    <line x1="25" y1="47" x2="25" y2="83" stroke="#6366f1" stroke-width="3"/>
    <line x1="7" y1="65" x2="43" y2="65" stroke="#6366f1" stroke-width="3"/>
  </g>
  <!-- right wheel -->
  <g class="wheel wr">
    <circle cx="75" cy="65" r="18" fill="none" stroke="#6366f1" stroke-width="4"/>
    <line x1="75" y1="47" x2="75" y2="83" stroke="#6366f1" stroke-width="3"/>
    <line x1="57" y1="65" x2="93" y2="65" stroke="#6366f1" stroke-width="3"/>
  </g>
  <!-- frame -->
  <polyline points="25,65 50,40 75,65" fill="none" stroke="#4f46e5" stroke-width="4" stroke-linejoin="round"/>
  <polyline points="50,40 60,28 75,40" fill="none" stroke="#4f46e5" stroke-width="4" stroke-linejoin="round"/>
  <!-- rider head -->
  <circle cx="62" cy="23" r="8" fill="#818cf8"/>
</svg>
