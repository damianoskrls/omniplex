<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <style>
    @keyframes breathe {
      0%,100% { transform: scale(1); }
      50%      { transform: scale(1.06); }
    }
    .g { transform-origin: 50px 50px; animation: breathe 3s ease-in-out infinite; }
  </style>
  <g class="g">
    <!-- head -->
    <circle cx="50" cy="18" r="9" fill="#a78bfa"/>
    <!-- arms spread -->
    <line x1="10" y1="46" x2="90" y2="46" stroke="#7c3aed" stroke-width="6" stroke-linecap="round"/>
    <!-- torso -->
    <rect x="44" y="28" width="12" height="22" rx="5" fill="#7c3aed"/>
    <!-- legs crossed -->
    <path d="M50 50 L28 75 Q50 65 72 75 Z" fill="#6d28d9"/>
  </g>
</svg>
