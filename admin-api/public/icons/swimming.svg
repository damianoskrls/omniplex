<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <style>
    @keyframes swim {
      0%,100% { transform: translateX(0) rotate(-5deg); }
      50%      { transform: translateX(6px) rotate(5deg); }
    }
    @keyframes wave {
      0%,100% { transform: translateX(0); }
      50%      { transform: translateX(-8px); }
    }
    .body { transform-origin: 50px 50px; animation: swim 1s ease-in-out infinite; }
    .water { animation: wave 1s ease-in-out infinite; }
  </style>
  <!-- water waves -->
  <g class="water">
    <path d="M5,72 Q20,64 35,72 Q50,80 65,72 Q80,64 95,72" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <path d="M5,82 Q20,74 35,82 Q50,90 65,82 Q80,74 95,82" fill="none" stroke="#7dd3fc" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- swimmer -->
  <g class="body">
    <circle cx="20" cy="50" r="9" fill="#6366f1"/>
    <rect x="28" y="46" width="36" height="10" rx="5" fill="#6366f1"/>
    <!-- arm forward -->
    <line x1="55" y1="50" x2="80" y2="38" stroke="#818cf8" stroke-width="5" stroke-linecap="round"/>
    <!-- leg kick -->
    <line x1="64" y1="52" x2="82" y2="62" stroke="#4f46e5" stroke-width="5" stroke-linecap="round"/>
    <line x1="60" y1="55" x2="76" y2="56" stroke="#4f46e5" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
