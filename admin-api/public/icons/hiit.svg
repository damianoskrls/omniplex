<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <style>
    @keyframes flash {
      0%,100% { opacity:1; transform: scale(1); }
      50%      { opacity:0.7; transform: scale(1.15); }
    }
    @keyframes pulse {
      0%,100% { r: 38; opacity: 0.15; }
      50%      { r: 46; opacity: 0.05; }
    }
    .bolt { transform-origin: 50px 50px; animation: flash 0.6s ease-in-out infinite; }
    .ring { animation: pulse 0.6s ease-in-out infinite; }
  </style>
  <circle class="ring" cx="50" cy="50" r="38" fill="#f59e0b" opacity="0.15"/>
  <g class="bolt">
    <polygon points="58,10 38,52 52,52 42,90 72,42 56,42" fill="#f59e0b"/>
  </g>
</svg>
