<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <style>
    @keyframes stretch {
      0%,100% { transform: scaleY(1); }
      50%      { transform: scaleY(1.08); }
    }
    .g { transform-origin: 50px 50px; animation: stretch 2s ease-in-out infinite; }
  </style>
  <g class="g">
    <!-- head -->
    <circle cx="50" cy="16" r="9" fill="#34d399"/>
    <!-- torso -->
    <rect x="44" y="26" width="12" height="20" rx="5" fill="#10b981"/>
    <!-- arms up -->
    <line x1="44" y1="32" x2="22" y2="14" stroke="#6ee7b7" stroke-width="5" stroke-linecap="round"/>
    <line x1="56" y1="32" x2="78" y2="14" stroke="#6ee7b7" stroke-width="5" stroke-linecap="round"/>
    <!-- left leg out -->
    <line x1="46" y1="46" x2="18" y2="68" stroke="#10b981" stroke-width="6" stroke-linecap="round"/>
    <!-- right leg down -->
    <line x1="54" y1="46" x2="82" y2="68" stroke="#10b981" stroke-width="6" stroke-linecap="round"/>
    <!-- ground line -->
    <line x1="10" y1="76" x2="90" y2="76" stroke="#a7f3d0" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
