name: bookup_app
description: BookUp white-label customer booking app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  shared_preferences: ^2.3.3
  intl: ^0.20.2
  provider: ^6.1.2
  flutter_svg: ^2.0.17
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  image_picker: ^1.1.2
  mobile_scanner: ^6.0.5
  qr_flutter: ^4.1.0
  share_plus: ^10.1.4
  image: ^4.5.4
  path_provider: ^2.1.5
  firebase_core: ^4.10.0
  firebase_messaging: ^16.3.0
  url_launcher: ^6.3.1
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.4
  gal: ^2.3.2
  video_player: ^2.9.5
  health: ^13.3.1
  flutter_blue_plus: ^2.3.8
  permission_handler: ^12.0.3
  fl_chart: ^0.70.2
  speech_to_text: ^7.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/tenant_config.json
    - assets/logo.png
    - assets/icons/
